[project]
name = "local-ocr"
version = "0.1.0"
description = "Shared local OCR service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.15.0",
    "docling-slim[convert-core,format-pdf,models-local]==2.133.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["ruff==0.14.14"]
mcp = ["mcp==1.30.0"]

[tool.uv]
package = false
